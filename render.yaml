services:
  - type: web
    name: cartiq-backend
    runtime: node
    rootDir: backend
    # Chromium install runs via backend/package.json's own "postinstall"
    # script, not appended here — that way it also runs on a service that
    # was created manually before this file existed (Render only
    # auto-applies render.yaml to Blueprint-created services; a pre-
    # existing service keeps whatever Build Command was set by hand in its
    # dashboard). `npm install` alone is enough either way. No `--with-deps`
    # — see src/utils/launchChromium.ts for why.
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      # Forces Playwright's Chromium download into node_modules/.cache
      # (relative to rootDir) instead of a $HOME-based cache dir — removes
      # any ambiguity about whether the build and start phases share the
      # same cache location, which matters because Trader Joe's session
      # establishment and the Sprouts product-image fallback both launch
      # this browser at runtime (see src/utils/launchChromium.ts).
      #
      # CONFIRMED LIVE (production error included the literal path
      # "/opt/render/.cache/ms-playwright/" — Playwright's *default*,
      # unset-var location): this env var is NOT reaching the running
      # service, which means the service is not actually syncing this
      # render.yaml file at all — almost certainly because it was created
      # by hand in the Render dashboard before this file existed. Render
      # only auto-applies render.yaml to Blueprint-created services. Every
      # env var in this file must currently also be added manually on the
      # service's Environment tab, or the service should be recreated via
      # New -> Blueprint so it tracks this file going forward.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: KROGER_CLIENT_ID
        sync: false
      - key: KROGER_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: VISION_RATE_LIMIT_PER_MINUTE
        value: "10"
